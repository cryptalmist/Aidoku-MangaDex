name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            multi.mangadex/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('multi.mangadex/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Build source
        run: |
          set -euo pipefail
          cd multi.mangadex
          aidoku package

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: multi.mangadex/package.aix
          tag_name: v${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
